<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
/* ============================================================
   GOLDEN COAST CONSTRUCTION & RESTORATION (GCCR)
   Color + Type foundations
   Source: Visual Identity Guidelines, rev 03/2023
   ------------------------------------------------------------
   Brand font is "Bliss Pro" (ExtraBold / Regular / ExtraBold Italic).
   Bliss Pro is a licensed font and is NOT on Google Fonts.
   SUBSTITUTE: "Hanken Grotesk" — a humanist sans with the same
   open apertures, modern proportions and a full weight range.
   Swap @font-face to real Bliss Pro for production if licensed.
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500;1,700;1,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  /* ---------- BRAND CORE PALETTE ---------- */
  --gc-gold:        #B49155; /* Pantone 465 C — primary accent */
  --gc-navy-deep:   #001E32; /* Pantone 296 C — deepest navy, headers/sidebars */
  --gc-navy:        #143764; /* Pantone 294 C — primary navy, structure + actions */
  --gc-blue:        #004B91; /* Pantone 293 C — interactive blue accent */
  --gc-steel:       #AAB4B9; /* Pantone 296 C @30% — steel blue-gray */
  --gc-beige:       #EBD796; /* Pantone 7402 C — soft beige highlight */

  /* ---------- NEUTRAL GRAYS (Cool Gray) ---------- */
  --gc-gray-60:     #828282; /* Cool Gray 9 C */
  --gc-gray-40:     #AFAFAF; /* Cool Gray 5 C */
  --gc-gray-20:     #D2D2D2; /* Cool Gray 1 C */

  /* ---------- DERIVED UI TINTS (oklch-harmonized to brand) ---------- */
  --gc-gold-tint:   #F4ECDC; /* soft gold wash for selected/attention bg */
  --gc-gold-dark:   #9A7B45; /* gold pressed / hover */
  --gc-navy-tint:   #E7ECF3; /* light navy wash — selected rows / focus bg */
  --gc-navy-700:    #0E2A4D; /* navy hover (between navy and deep) */
  --gc-blue-tint:   #E5EFF8; /* link/info background tint */

  /* ---------- SURFACES ---------- */
  --gc-bg:          #FFFFFF; /* primary working surface */
  --gc-bg-soft:     #F5F6F8; /* app canvas / page background (cool light gray) */
  --gc-bg-sunken:   #EDEFF2; /* sunken wells, code, inputs */
  --gc-line:        #E2E5EA; /* hairline dividers */
  --gc-line-strong: #D2D2D2; /* stronger dividers / input borders */

  /* ---------- TEXT ROLES ---------- */
  --gc-fg:          #0B1A2B; /* primary text — near-black navy */
  --gc-fg-2:        #3D4A5C; /* secondary text */
  --gc-fg-3:        #6B7785; /* muted / captions */
  --gc-fg-on-navy:  #FFFFFF; /* text on navy surfaces */
  --gc-fg-on-navy-2:#AAB4B9; /* secondary text on navy (steel) */

  /* ---------- SEMANTIC STATUS (harmonized to the cool navy/gold palette) ---------- */
  --gc-success:     #2C7A57; /* muted pine green — cool, professional */
  --gc-success-bg:  #E6F0EA;
  --gc-warning:     #A67C2E; /* deep brand-gold amber */
  --gc-warning-bg:  #F6ECD6;
  --gc-danger:      #A6342A; /* muted brick / fire red — earthy, not neon */
  --gc-danger-bg:   #F6E5E2;
  --gc-info:        #004B91; /* brand blue */
  --gc-info-bg:     #E5EFF8;

  /* ---------- SERVICE CATEGORY ACCENTS (Fire / Structure / Content / Restoration) ---------- */
  --gc-svc-fire:    #A6342A;
  --gc-svc-structure: #143764;
  --gc-svc-content: #B49155;
  --gc-svc-restoration: #004B91;

  /* ---------- TYPE FAMILIES ---------- */
  --gc-font-display: 'Hanken Grotesk', 'Bliss Pro', system-ui, sans-serif; /* titles — use 800 */
  --gc-font-body:    'Hanken Grotesk', 'Bliss Pro', system-ui, sans-serif; /* body — 400/500 */
  --gc-font-mono:    'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;  /* data, codes, IDs */

  /* ---------- TYPE SCALE (guideline rule: H ≈ 5× body, subtitle ≈ 2× body) ---------- */
  --gc-text-xs:   12px;
  --gc-text-sm:   14px;
  --gc-text-base: 16px;
  --gc-text-lg:   18px;
  --gc-text-xl:   22px;
  --gc-text-2xl:  28px;
  --gc-text-3xl:  36px;
  --gc-text-4xl:  48px;
  --gc-text-5xl:  64px;
  --gc-text-6xl:  84px;

  /* ---------- WEIGHTS ---------- */
  --gc-w-regular: 400;
  --gc-w-medium:  500;
  --gc-w-semibold:600;
  --gc-w-bold:    700;
  --gc-w-extrabold:800;
  --gc-w-black:   900;

  /* ---------- RADII ---------- */
  --gc-r-xs:  3px;
  --gc-r-sm:  5px;
  --gc-r-md:  8px;
  --gc-r-lg:  12px;
  --gc-r-xl:  16px;
  --gc-r-pill: 999px;

  /* ---------- SPACING (4px base) ---------- */
  --gc-sp-1: 4px;
  --gc-sp-2: 8px;
  --gc-sp-3: 12px;
  --gc-sp-4: 16px;
  --gc-sp-5: 20px;
  --gc-sp-6: 24px;
  --gc-sp-8: 32px;
  --gc-sp-10: 40px;
  --gc-sp-12: 48px;
  --gc-sp-16: 64px;
  --gc-sp-20: 80px;

  /* ---------- SHADOWS (cool navy-tinted, restrained) ---------- */
  --gc-shadow-xs: 0 1px 2px rgba(0, 30, 50, 0.10);
  --gc-shadow-sm: 0 1px 3px rgba(0, 30, 50, 0.13), 0 1px 2px rgba(0, 30, 50, 0.08);
  --gc-shadow-md: 0 6px 16px rgba(0, 30, 50, 0.15), 0 2px 5px rgba(0, 30, 50, 0.09);
  --gc-shadow-lg: 0 16px 34px rgba(0, 30, 50, 0.20), 0 6px 12px rgba(0, 30, 50, 0.10);
  --gc-ring: 0 0 0 3px rgba(0, 75, 145, 0.28); /* focus ring — brand blue */
}

/* ============================================================
   SEMANTIC TYPOGRAPHY CLASSES
   ============================================================ */
.gc-display {
  font-family: var(--gc-font-display);
  font-weight: var(--gc-w-extrabold);
  font-size: var(--gc-text-6xl);
  line-height: 0.98;
  letter-spacing: -0.02em;
  color: var(--gc-fg);
}
.gc-h1 {
  font-family: var(--gc-font-display);
  font-weight: var(--gc-w-extrabold);
  font-size: var(--gc-text-4xl);
  line-height: 1.04;
  letter-spacing: -0.015em;
  color: var(--gc-fg);
}
.gc-h2 {
  font-family: var(--gc-font-display);
  font-weight: var(--gc-w-bold);
  font-size: var(--gc-text-3xl);
  line-height: 1.1;
  letter-spacing: -0.01em;
  color: var(--gc-fg);
}
.gc-h3 {
  font-family: var(--gc-font-display);
  font-weight: var(--gc-w-bold);
  font-size: var(--gc-text-2xl);
  line-height: 1.15;
  letter-spacing: -0.005em;
  color: var(--gc-fg);
}
.gc-h4 {
  font-family: var(--gc-font-display);
  font-weight: var(--gc-w-semibold);
  font-size: var(--gc-text-xl);
  line-height: 1.25;
  color: var(--gc-fg);
}
/* Subtitle — guideline uses ExtraBold Italic, ALL CAPS, generous tracking */
.gc-subtitle {
  font-family: var(--gc-font-display);
  font-weight: var(--gc-w-extrabold);
  font-style: italic;
  font-size: var(--gc-text-xl);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--gc-gold);
  line-height: 1.2;
}
.gc-lead {
  font-family: var(--gc-font-body);
  font-weight: var(--gc-w-regular);
  font-size: var(--gc-text-lg);
  line-height: 1.6;
  color: var(--gc-fg-2);
}
.gc-body {
  font-family: var(--gc-font-body);
  font-weight: var(--gc-w-regular);
  font-size: var(--gc-text-base);
  line-height: 1.6;
  color: var(--gc-fg-2);
}
.gc-small {
  font-family: var(--gc-font-body);
  font-weight: var(--gc-w-regular);
  font-size: var(--gc-text-sm);
  line-height: 1.5;
  color: var(--gc-fg-3);
}
/* Eyebrow / label — uppercase tracked, the brand's tab/category treatment */
.gc-eyebrow {
  font-family: var(--gc-font-body);
  font-weight: var(--gc-w-bold);
  font-size: var(--gc-text-xs);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gc-gray-60);
}
.gc-mono {
  font-family: var(--gc-font-mono);
  font-size: var(--gc-text-sm);
  letter-spacing: 0;
  color: var(--gc-fg-2);
}


* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--gc-font-body);
  color: var(--gc-fg);
  background: var(--gc-bg-soft);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
#root { min-height: 100vh; }
button { font-family: inherit; cursor: pointer; }
a { color: inherit; }
img { display: block; }
input, textarea, select { font-family: inherit; }
.mono { font-family: var(--gc-font-mono); font-variant-numeric: tabular-nums; }

/* ============ DARK THEME TOKEN OVERRIDES ============ */
body.dark-mode { background: #04182a; }
.app.dark {
  background: #04182a;
  --gc-bg-soft:    #04182a;
  --gc-bg:         #0c2c47;
  --gc-bg-sunken:  #08243b;
  --gc-line:       rgba(255,255,255,0.09);
  --gc-line-strong:rgba(255,255,255,0.16);
  --gc-fg:         #EAF1F8;
  --gc-fg-2:       #B7C5D4;
  --gc-fg-3:       #8194A6;
  --gc-navy-tint:  rgba(255,255,255,0.07);
  --gc-gold-tint:  rgba(180,145,85,0.18);
  --gc-blue-tint:  rgba(0,75,145,0.26);
  --gc-success:    #5FBF92; --gc-success-bg: rgba(44,122,87,0.20);
  --gc-danger:     #E59A90; --gc-danger-bg:  rgba(166,52,42,0.24);
  --gc-info:       #74B2EE; --gc-info-bg:    rgba(0,75,145,0.28);
  --gc-warning:    #DBB66E; --gc-warning-bg: rgba(166,124,46,0.22);
  --gc-gold:       #C9A86A;
  --gc-shadow-xs:  0 1px 2px rgba(0,0,0,0.30);
  --gc-shadow-sm:  0 1px 3px rgba(0,0,0,0.40), 0 1px 2px rgba(0,0,0,0.30);
  --gc-shadow-md:  0 6px 18px rgba(0,0,0,0.45);
}

/* ============ LAYOUT ============ */
.app { min-height: 100vh; background: var(--gc-bg-soft); }

/* header */
.hdr { background: var(--gc-navy-deep); color: #fff; position: sticky; top: 0; z-index: 50; overflow: hidden; }
.hdr-inner { max-width: 1160px; margin: 0 auto; padding: 22px 32px 20px; position: relative; z-index: 2; }
.hdr-chevron { position: absolute; top: 0; right: 0; height: 100%; width: 340px; opacity: 0.5; pointer-events: none; z-index: 1;
  background: linear-gradient(135deg, transparent 38%, rgba(20,55,100,0.55) 38%, rgba(20,55,100,0.55) 50%, transparent 50%, transparent 62%, rgba(180,145,85,0.22) 62%, rgba(180,145,85,0.22) 70%, transparent 70%); }
.hdr-top { display: flex; align-items: center; gap: 16px; }
.hdr-mono { height: 34px; flex-shrink: 0; }
.eyebrow-gold { font-size: 11px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gc-gold); font-style: italic; }
.hdr-title { font-family: var(--gc-font-display); font-weight: 800; font-size: 27px; letter-spacing: -0.015em; margin: 1px 0 0; line-height: 1; }
.hdr-meta { color: var(--gc-steel); font-size: 12.5px; margin-top: 3px; }
.hdr-meta b { color: #dfe6ee; font-weight: 600; }
.source-pill { display: inline-flex; align-items: center; width: fit-content; margin-top: 7px; border: 1px solid rgba(255,255,255,0.18);
  border-radius: 999px; padding: 3px 9px; color: #dfe6ee; background: rgba(255,255,255,0.06); font-size: 11px; font-weight: 800; letter-spacing: 0.02em; }
.source-pill::before { content: ''; width: 7px; height: 7px; border-radius: 999px; margin-right: 7px; background: var(--gc-gold); }
.source-live::before { background: var(--gc-success); box-shadow: 0 0 0 3px rgba(95,191,146,0.18); }
.source-loading::before { background: var(--gc-info); }

/* icon button */
.iconbtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06);
  color: #dfe6ee; border-radius: var(--gc-r-md); padding: 8px 13px; font-size: 13px; font-weight: 700; transition: background .15s, border-color .15s; }
.iconbtn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.34); }
.lc { width: 18px; height: 18px; stroke-width: 1.75; }
.lc-sm { width: 15px; height: 15px; stroke-width: 1.85; }

/* container */
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 32px 64px; }

/* ============ KPI STRIP ============ */
.kpi-row { display: grid; grid-template-columns: repeat(9, 1fr); gap: 12px; margin: -34px 0 22px; position: relative; z-index: 3; }
.kpi { background: var(--gc-bg); border: 1px solid var(--gc-line); border-radius: var(--gc-r-md); padding: 13px 14px 12px;
  box-shadow: var(--gc-shadow-sm); position: relative; overflow: hidden; min-width: 0; }
.kpi::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent, var(--gc-gray-40)); }
.kpi-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gc-fg-3); line-height: 1.25; min-height: 26px; }
.kpi-val { font-family: var(--gc-font-mono); font-weight: 600; font-size: 27px; letter-spacing: -0.02em; color: var(--gc-fg); margin-top: 5px; line-height: 1; }
.kpi-val.accentval { color: var(--accent); }

/* ============ FILTER BAR ============ */
.filters { background: var(--gc-bg); border: 1px solid var(--gc-line); border-radius: var(--gc-r-md); box-shadow: var(--gc-shadow-sm);
  padding: 10px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; position: sticky; top: calc(var(--hdr-h, 100px) + 8px); z-index: 20; overflow: visible; }
.fsep { width: 1px; align-self: stretch; background: var(--gc-line); margin: 2px 0; flex-shrink: 0; }
.filters-top { margin-top: 18px; }
@media (max-width: 720px){ .filters-top { margin-top: 14px; } }

/* dropdown select */
.selwrap { position: relative; display: inline-block; }
.selbtn { display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
  border: 1px solid var(--gc-line-strong); background: var(--gc-bg-sunken); color: var(--gc-fg); border-radius: var(--gc-r-md);
  padding: 8px 11px; font-size: 13px; font-weight: 700; transition: border-color .12s, box-shadow .12s; }
.selbtn:hover { border-color: var(--gc-fg-3); }
.selbtn.open { border-color: var(--gc-blue); box-shadow: var(--gc-ring); }
.selbtn .lc-sm { color: var(--gc-fg-3); flex-shrink: 0; }
.selmenu { position: absolute; left: 0; top: calc(100% + 5px); min-width: 100%; background: var(--gc-bg);
  border: 1px solid var(--gc-line-strong); border-radius: var(--gc-r-md); box-shadow: var(--gc-shadow-md); padding: 4px; z-index: 40; }
.selmenu button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: none; background: transparent;
  color: var(--gc-fg-2); font-size: 13px; font-weight: 600; padding: 8px 10px; border-radius: var(--gc-r-sm); white-space: nowrap; }
.selmenu button:hover { background: var(--gc-navy-tint); }
.selmenu button.sel { color: var(--gc-fg); font-weight: 700; }
.selmenu button.sel .lc-sm { color: var(--gc-gold); }
.fgroup { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.flabel { font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gc-fg-3); white-space: nowrap; }
.seg { display: inline-flex; background: var(--gc-bg-sunken); border-radius: var(--gc-r-sm); padding: 3px; gap: 2px; }
.seg button { border: none; background: transparent; color: var(--gc-fg-3); font-weight: 700; font-size: 12.5px; padding: 6px 12px; border-radius: 4px; white-space: nowrap; transition: color .12s, background .12s; }
.seg button:hover { color: var(--gc-fg-2); }
.seg button.on { background: var(--gc-bg); color: var(--gc-navy); box-shadow: var(--gc-shadow-xs); }
.app.dark .seg button.on { color: var(--gc-gold); }
.search { position: relative; margin-left: auto; flex-shrink: 0; }
.search input { width: 220px; padding: 8px 12px 8px 33px; font-size: 13px; border: 1px solid var(--gc-line-strong); border-radius: var(--gc-r-md);
  background: var(--gc-bg-sunken); color: var(--gc-fg); outline: none; transition: border-color .15s, box-shadow .15s; }
.search input:focus { border-color: var(--gc-blue); box-shadow: var(--gc-ring); }
.search .si { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--gc-fg-3); display: inline-flex; }

/* ============ PROJECT CARD ============ */
.pcard { background: var(--gc-bg); border: 1px solid var(--gc-line); border-radius: var(--gc-r-md); box-shadow: var(--gc-shadow-sm);
  margin-top: 14px; overflow: hidden; }
.pcard-hd { display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-bottom: 1px solid var(--gc-line); flex-wrap: wrap; }
.pcard-region { width: 4px; align-self: stretch; border-radius: 999px; flex-shrink: 0; margin: -2px 2px -2px 0; }
.pname { font-family: var(--gc-font-display); font-weight: 800; font-size: 16.5px; letter-spacing: -0.01em; color: var(--gc-fg); }
.psub { font-size: 12px; color: var(--gc-fg-3); margin-top: 2px; display: flex; align-items: center; gap: 8px; }
.pcard-latest { margin-left: auto; text-align: right; display: flex; align-items: center; gap: 14px; }
.latest-txt { font-size: 11px; color: var(--gc-fg-3); }
.latest-txt .lt-em { color: var(--gc-fg); font-weight: 700; font-size: 12.5px; display: block; margin-top: 1px; }
.count-chip { background: var(--gc-bg-sunken); color: var(--gc-fg-2); font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 4px 11px; white-space: nowrap; }

/* table */
.dtable { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 760px; }
.dtable th { text-align: left; font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gc-fg-3);
  padding: 9px 16px; background: var(--gc-bg-sunken); border-bottom: 1px solid var(--gc-line); white-space: nowrap; }
.dtable td { padding: 13px 16px; border-bottom: 1px solid var(--gc-line); font-size: 13px; color: var(--gc-fg-2); vertical-align: top; }
.dtable tr:last-child td { border-bottom: none; }
.dtable tbody tr:hover { background: var(--gc-navy-tint); }

/* status-marked rows — glanceable */
.drow td:first-child { box-shadow: inset 3px 0 0 transparent; }
.drow-invoice   td { background: color-mix(in srgb, var(--gc-info-bg) 55%, transparent); }
.drow-invoice   td:first-child { box-shadow: inset 3px 0 0 var(--gc-info); }
.drow-collected td { background: color-mix(in srgb, var(--gc-success-bg) 60%, transparent); }
.drow-collected td:first-child { box-shadow: inset 3px 0 0 var(--gc-success); }
.drow-invoice:hover   td { background: color-mix(in srgb, var(--gc-info-bg) 75%, transparent); }
.drow-collected:hover td { background: color-mix(in srgb, var(--gc-success-bg) 80%, transparent); }
.drow-collected .cell-date,
.drow-collected .draw-name,
.drow-collected .trig { color: var(--gc-fg); }
.td-act { text-align: right; padding-left: 8px; padding-right: 14px; }
.cell-date { font-family: var(--gc-font-mono); font-size: 12.5px; color: var(--gc-fg); white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 500; }
.cd-time { font-family: var(--gc-font-mono); font-size: 11.5px; color: var(--gc-fg-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
.draw-name { font-weight: 700; color: var(--gc-fg); font-size: 13px; margin-bottom: 5px; }
.trig { font-weight: 700; color: var(--gc-fg); font-size: 13px; line-height: 1.3; }
.trig-item { color: var(--gc-fg-3); font-size: 12px; margin-top: 3px; line-height: 1.35; text-wrap: pretty; }
.by { display: flex; align-items: flex-start; gap: 9px; font-size: 12.5px; color: var(--gc-fg); }
.by-name { line-height: 1.3; padding-top: 4px; text-wrap: pretty; }
.av { width: 26px; height: 26px; border-radius: 999px; background: var(--gc-navy); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 800; flex-shrink: 0; }
.app.dark .av { background: var(--gc-gold); color: #20180a; }

/* badges */
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; letter-spacing: 0.02em; white-space: nowrap; }
.badge .bdot { width: 6px; height: 6px; border-radius: 999px; }
.b-invoice { background: var(--gc-blue-tint); color: var(--gc-info); }
.b-collection { background: var(--gc-gold-tint); color: var(--gc-gold-dark); }
.app.dark .b-collection { color: var(--gc-gold); }
.t-late { background: var(--gc-danger-bg); color: var(--gc-danger); }
.t-ahead { background: var(--gc-success-bg); color: var(--gc-success); }
.t-on { background: var(--gc-navy-tint); color: var(--gc-fg-2); }

/* actions */
